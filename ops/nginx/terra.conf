server {
    listen 80;
    server_name terra.iqapps.space;
    return 301 https://terra.iqapps.space$request_uri;
}

server {
    listen 443 ssl;
    server_name terra.iqapps.space;

    root /srv/apps/terra/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/terra.iqapps.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/terra.iqapps.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Vite fingerprints these files, so they can be cached indefinitely.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location = /favicon.svg {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
